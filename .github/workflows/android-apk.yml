name: APK Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENDAPP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK fixado
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle e validar Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Permitir execução do Wrapper
        run: chmod +x gradlew
      - name: Testes automatizados e análise Android
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: Compilar APK instalável
        run: ./gradlew assembleDebug --stacktrace
      - name: Verificar assinatura
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agendapp-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agendapp-relatorios-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
